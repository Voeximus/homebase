<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <!-- Replaced at runtime by src/lib/theme.ts from the computed ground, so
         the status bar on an installed PWA follows the chosen theme. This value
         is only what the browser uses for the instant before that runs. -->
    <meta name="theme-color" content="#f3f2ee" />
    <script>
      // The stored choice, stamped before anything paints. Mirrors
      // src/lib/theme.ts: "system" stamps nothing and lets the media query decide.
      try {
        var t = localStorage.getItem("hb-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <!-- The app handles its own EN/中文 i18n — stop the mobile browser from
         auto-translating on top of it (which turned 中 into "middle" and
         mangled casing). -->
    <meta name="google" content="notranslate" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Homebase" />
    <title>Homebase</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
