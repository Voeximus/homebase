/* ---- sheets.js ---- */
/* ===== Info sheets. Each "how the app works" line carries its own tag: "Our rule" (no study), and/or the grade of
   the study note it rests on. Study text is only ever correctedClaim, word for word, with its grade.
   rules: [text, basisIds, ours]   key: study notes shown open   ids: the rest, inside a closed "Study details". ===== */
const INFO = {
  e1rm: { title: "How the estimated max works", rules: [
    ["The app estimates the most you could lift once from a set: weight × (1 + reps ÷ 30). A single counts as exactly its weight.", ["formula-1"], false],
    ["Sets of 11–15 reps are marked rough. Above 15 reps the app doesn’t estimate.", [], true],
    ["The chart can add the reps you had left to your reps before estimating. Sets with no reps left noted are then shown as hollow dots and never joined to the others.", ["formula-3"], true],
  ], key: ["E2", "E4"], ids: ["E3", "E1", "formula-1", "formula-3", "formula-4"] },
  effort: { title: "Reps left in the tank", rules: [
    ["After a set, note how many more reps you could have done: 0, 1, 2, 3 or 4 or more. It never blocks your next set.", [], true],
  ], key: ["R2", "R1"], ids: ["P1", "P2"] },
  sets: { title: "Hard sets per muscle", rules: [
    ["A hard set is a finished working set with 3 or fewer reps left. Sets where you didn’t note effort still count and are marked.", ["P3"], true],
    ["Warm-ups never count.", ["W2"], false],
    ["A set counts fully for its main muscles and half for its helper muscles.", ["V1", "V2"], false],
    ["Which muscles are main and which are helpers is our judgement for each exercise.", [], true],
    ["The tick marks at 4, 10 and 18 on each bar are bands from one pooled analysis (a preprint), shown for context, not a target.", ["V3", "formula-6"], false],
    ["No band is shown when most of a muscle’s sets are timed holds, or when effort wasn’t noted for most of them.", [], true],
    ["The app doesn’t add up total weight lifted across exercises.", ["formula-9", "W3"], false],
  ], key: ["V2", "V3"], ids: ["P3", "W1", "W2", "V1", "W3", "formula-6", "formula-9"] },
  rest: { title: "Rest", rules: [
    ["Default rest: 2 minutes for exercises that move several joints, 1½ minutes for single-joint exercises, 3 minutes when the top of the rep range is 5 or fewer.", ["formula-12"], true],
    ["Bodyweight, band and timed exercises start at 60 seconds. A warm-up set gets 60 seconds (or less if that exercise’s rest is shorter).", [], true],
    ["You can change the rest for any exercise, or turn its timer off.", [], true],
  ], key: ["T1"], ids: ["T2", "formula-12"] },
  records: { title: "Records", rules: [
    ["A rep record is the heaviest weight you’ve done for at least that many reps.", ["PR1", "formula-15"], false],
    ["An estimated-max record only counts when your reps plus the reps you had left add up to 10 or fewer, you noted reps left (or marked the set ‘to failure’), and it beats your old best by at least 5 lb (2.5 kg).", ["PR1", "formula-15"], false],
    ["Warm-ups are never records. The first time you log an exercise is saved, but never celebrated as a record.", [], true],
  ], key: ["PR1"], ids: ["formula-15", "formula-4"] },
  plates: { title: "Plates and units", rules: [
    ["The app picks the fewest plates, with the heaviest closest to the middle.", ["PL2", "formula-13"], false],
    ["Weights are kept in the unit you typed. This mockup works in lb only.", ["PL3"], false],
  ], key: [], ids: ["PL1", "PL2", "PL3", "formula-13", "formula-14"] },
  bands: { title: "Why bands have no pounds", rules: [["Band sets are logged by band label and reps, never as a weight.", ["band-colour-not-weight"], true]], key: ["band-colour-not-weight"], ids: [] },
};
function infoSheet(key) {
  if (key === "science") {
    const sc = EV.meta.scheme, bt = EV.meta.badge;
    return { title: "How to read the science notes", icon: "book-open", body: `
      <div style="display:flex;flex-direction:column;gap:10px">${["A", "B", "C"].map((g) => `<div><span class="badge"><span class="g" aria-hidden="true">${GLYPH[g]}</span>${esc(bt[g])}</span><p class="h-sub" style="margin-top:4px;font-size:12px">${esc(sc[g])}</p></div>`).join("")}</div>
      <p class="h-sub" style="margin-top:10px;font-size:12px">A note tested on a similar exercise says so. A note about a whole group, such as all band exercises, says so too. Tap a badge to see its sources.</p>
      <p class="seclabel" style="margin-top:14px">Why there are no muscle activation percentages</p>
      ${claimCard(EVI["hipthrust-emg-not-growth"], "this")}
      <p class="seclabel" style="margin-top:14px">More study notes</p>
      ${claimCard(EVI["lengthened-partials-general"], "this")}
      <p class="h-sub" style="font-size:12px;margin:-2px 0 6px">The last part is advice, not a test result.</p>
      ${claimCard(EVI["regional-growth-general"], "this")}
      ${claimCard(EVI["light-load-to-failure"], "this")}
      ${claimCard(EVI["L2"], "this")}` };
  }
  const inf = INFO[key];
  const byGrade = (a, b) => GRADE_ORDER[EVI[a].grade] - GRADE_ORDER[EVI[b].grade];
  const studies = inf.ids.filter((id) => EVI[id] && EVI[id].kind !== "formula").sort(byGrade);
  const formulas = inf.ids.filter((id) => EVI[id] && EVI[id].kind === "formula");
  const line = ([text, basis, ours]) => `<div style="font-size:13px">${esc(text)}<div class="badges" style="margin:4px 0 0">${ours ? ruleTag : ""}${basis.map(gradeTag).join("")}</div></div>`;
  return { title: inf.title, icon: "info", body: `
    <p class="seclabel" style="margin:4px 0 6px">How the app works</p>
    <div style="display:flex;flex-direction:column;gap:10px">${inf.rules.map(line).join("")}</div>
    <p class="hb-tiny" style="margin-top:6px">A grade tag means the line rests on a study note in this sheet. “Our rule” means no study tested it.</p>
    ${inf.key.length ? `<p class="seclabel" style="margin:16px 0 2px">Study notes to know</p>${inf.key.map((id) => claimCard(EVI[id], "this")).join("")}` : ""}
    ${studies.length || formulas.length ? `<details class="src" style="margin-top:10px"><summary>${ic("chevron-down")}Study details (${studies.length + formulas.length})</summary>
      ${studies.map((id) => claimCard(EVI[id], "this")).join("")}
      ${formulas.length ? `<p class="seclabel" style="margin:14px 0 2px">The exact formulas (technical)</p>${formulas.map((id) => claimCard(EVI[id], "this")).join("")}` : ""}
    </details>` : ""}` };
}

/* ===== Sheet renderer ===== */
function sheetShell(title, icon, body, foot, sub) {
  return `<div class="ov" data-a="ov"><div class="sheet ${ANIM.sheet ? "rise" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-hd">${icon ? ic(icon, 17) : ""}<div class="sheet-title">${esc(title)}</div><button class="sheet-close" data-a="close" aria-label="Close">${ic("x", 20)}</button></div>
    ${sub ? `<div class="sheet-sub">${sub}</div>` : ""}
    <div class="sheet-bd">${body}</div>${foot ? `<div class="sheet-ft">${foot}</div>` : ""}</div></div>`;
}
function bottomShell(title, body) {
  return `<div class="ov-b" data-a="ov"><div class="bsheet ${ANIM.sheet ? "rise" : ""}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="bsheet-hd"><div class="bsheet-title">${esc(title)}</div><button class="sheet-close" data-a="close" aria-label="Close">${ic("x", 18)}</button></div>${body}</div></div>`;
}
function renderSheet() {
  const sh = S.sheet;
  if (!sh) return "";
  switch (sh.t) {
    case "menu": return sheetShell(sh.title, sh.icon, `<div class="menu">${sh.items.map((it, i) => `<button data-a="mi" data-i="${i}" class="${it.danger ? "danger" : ""}" ${it.disabled ? "disabled" : ""}>${ic(it.icon || "chevron-right")}${esc(it.label)}${it.hint ? `<small>${esc(it.hint)}</small>` : ""}</button>`).join("")}</div>`, "", sh.sub);
    case "confirm": return sheetShell(sh.title, sh.icon || "info", `<p style="font-size:13.5px;color:var(--color-bone)">${esc(sh.text)}</p>`,
      `<button class="h-btn quiet" style="flex:1" data-a="confirm-no">${esc(sh.no || "Keep")}</button><button class="h-btn ${sh.danger ? "danger" : ""}" style="flex:1" data-a="confirm-yes">${esc(sh.yes)}</button>`);
    case "info": { const s = infoSheet(sh.k); return sheetShell(s.title, s.icon, s.body); }
    case "finish": return finishSheet();
    case "quick": return quickSheet();
    case "session": return sessionSheet();
    case "plates": return plateSheet();
    case "text": return sheetShell(sh.title, sh.icon || "pencil", `${sh.multiline ? `<textarea class="tarea" rows="4" data-b="sheet-text" aria-label="${esc(sh.title)}" placeholder="${esc(sh.placeholder || "")}">${esc(sh.value)}</textarea>` : `<input class="tinput" data-b="sheet-text" aria-label="${esc(sh.title)}" value="${esc(sh.value)}" placeholder="${esc(sh.placeholder || "")}">`}`,
      `<button class="h-btn quiet" style="flex:1" data-a="close">Cancel</button><button class="h-btn" style="flex:1" data-a="text-save">Save</button>`);
    case "rest": {
      const e = ACT().exercises[sh.e];
      const cur = restFor(e);
      return sheetShell("Rest time", "timer", `<p class="h-sub" style="margin-bottom:8px">${esc(e.name)} · default ${fmtRest(M.restDefault(exOf(e.name), { repsHi: e.target.hi }))} ${infoBtn("rest", "How rest defaults work").replace('class="iconbtn"', 'class="iconbtn" style="display:inline-grid;vertical-align:middle;height:32px"')}</p>
        <div class="chips">${[0, 30, 60, 90, 120, 150, 180, 240].map((v) => `<button class="qchip h-hit${cur === v ? " on" : ""}" data-a="rest-set" data-v="${v}">${fmtRest(v)}</button>`).join("")}</div>`);
    }
    case "band": return sheetShell("Band label", "list", `<p class="h-sub" style="margin-bottom:8px">Bands are logged by label, not pounds. ${infoBtn("bands", "Why bands have no pounds").replace('class="iconbtn"', 'class="iconbtn" style="display:inline-grid;vertical-align:middle;height:32px"')}</p><div class="menu">${BANDS.map((b) => `<button data-a="band-set" data-v="${b}">${ic("check")}${b}</button>`).join("")}</div>`);
    case "heat": {
      const hs = hardSetsWindow(S.person, S.prog.period);
      const c = hs.contrib[sh.region] || {};
      const v = hs.S[sh.region] || 0;
      return sheetShell(REGIONS[sh.region], "user", `<div class="h-stat num">${fmtSets(v)} <span class="un">hard sets · ${S.prog.period === 7 ? "last 7 days" : "per week, last 4 weeks"}</span></div>
        <p class="hb-tiny" style="margin:2px 0 8px">${esc(rowBandText(hs, sh.region))}</p>
        ${Object.keys(c).length ? Object.entries(c).sort((a, b) => b[1].v - a[1].v).map(([n, x]) => `<button class="lrow" data-a="detail" data-name="${esc(n)}"><span class="name">${esc(n)}<span class="meta">${x.role} · counts ${x.role === "Main" ? "1" : "½"} per set</span></span><span class="val num">${fmtSets(x.v)}</span>${ic("chevron-right", 14)}</button>`).join("") : `<p class="h-sub">Nothing in this period.</p>`}
        <div style="margin-top:8px">${infoBtn("sets", "What counts as a hard set").replace('class="iconbtn"', 'class="h-link on"').replace("</svg>", "</svg>How this is counted")}</div>`);
    }
    case "custom": return customSheet();
    case "wsettings": return settingsSheet();
    case "appearance": return bottomShell("Appearance", `<p class="seclabel" style="margin-bottom:8px">Health theme</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[["original", "Calm", "Warm ground", "#34d399", "#101319"], ["instrument", "Instrument", "Precise, mono", "#22d3ee", "#080b0e"], ["bold", "Bold", "Big type", "#a3e635", "#0d0e12"]].map(([id, l, b, dot, gr]) => `<button data-a="theme" data-v="${id}" aria-pressed="${S.theme === id}" style="border-radius:14px;border:1px solid ${S.theme === id ? "var(--color-accent)" : "var(--color-edge)"};padding:10px;text-align:center;background:var(--color-raised)">
        <div style="margin-bottom:8px;display:grid;height:40px;place-items:center;border-radius:10px;background:${gr}"><span style="width:16px;height:16px;border-radius:99px;background:${dot};display:block"></span></div>
        <div style="font-size:12px;font-weight:600">${l}</div><div style="font-size:10px;color:var(--color-taupe);margin-top:2px">${b}</div>
        <div style="margin-top:4px;font-size:10px;color:var(--color-accent);visibility:${S.theme === id ? "visible" : "hidden"}">On</div></button>`).join("")}</div>`);
  }
  return "";
}
function finishSheet() {
  const a = ACT();
  const fi = finishInfo(a);
  const countTyped = !!S.sheet.countUnticked;
  const removed = removedParts(fi, countTyped);
  const recs = [];
  a.exercises.forEach((e) => e.sets.forEach((s) => { if (s.done && s.rec && s.kind !== "warmup") recs.push({ e, s }); }));
  recs.sort((x, y) => (x.s.rec === "rep" ? 0 : 1) - (y.s.rec === "rep" ? 0 : 1));
  const w = sessionToWorkout(a, countTyped);
  const hs = hardSets([w], exOf);
  const top = REGION_ORDER.filter((r) => hs.S[r]).sort((x, y) => hs.S[y] - hs.S[x]).slice(0, 6);
  const dayWord = a.date === TODAY ? "today" : `on ${fmtDate(a.date)}`;
  // unticked sets first, worded by exercise, so a forgotten tick is caught before Save

/* ===== Input handling (never re-renders the typed field) ===== */
document.addEventListener("input", (ev) => {
  const el = ev.target;
  const b = el.dataset && el.dataset.b;
  if (!b) return;
  const d = el.dataset;
  switch (b) {
    case "set": {
      const entry = ACT().exercises[+d.e], s = entry.sets[+d.s];
      s[d.f] = el.value;
      if (s.err) { s.err = null; const box = el.closest(".numin"); if (box) box.classList.remove("err"); const msg = el.closest(".setrow").querySelector(".rowmsg"); if (msg) msg.remove(); }
      // a ticked set whose numbers change gets its record tag worked out again (DOM patch only, the box keeps focus)
      if (s.done && s.kind !== "warmup") {
        const ex = exOf(entry.name);
        s.rec = modeOf(ex) === "cardio" ? null : recordCheck(priorForSession(entry, +d.s), toStoredSet(s, ex, entry), ex);
        const btn = el.closest(".setrow").querySelector(".setno");
        const mark = btn && btn.querySelector(".recmark");
        if (mark) { mark.classList.toggle("on", !!s.rec); mark.classList.toggle("est", s.rec === "est"); }
        if (btn) btn.setAttribute("aria-label", `Set ${rowLabel(entry, +d.s)}${s.rec === "rep" ? ", record" : s.rec === "est" ? ", best estimated max" : ""}. Change set type`);
      }
      break;
    }
    case "lib-q": S.lib.q = el.value; document.getElementById("libResults").innerHTML = libResults(); break;
    case "ql-q": S.sheet.q = el.value; document.getElementById("qlResults").innerHTML = quickResults(); break;
    case "ql": S.sheet.f[d.f] = el.value; if (S.sheet.err) { S.sheet.err = null; const m = document.querySelector('.sheet [role="alert"]'); if (m) m.remove(); } break;
    case "sheet-text": S.sheet.value = el.value; break;
    case "sess-note": ACT().note = el.value; break;
    case "pl-target": { const v = num(el.value); if (v >= 0) { S.sheet.target = v; } break; }
    case "cu-name": S.sheet.c.name = el.value; { const btn = document.querySelector('[data-a="cu-save"]'); if (btn) btn.disabled = !el.value.trim(); } break;
    case "rb-name": S.stack[S.stack.length - 1].draft.name = el.value; break;
    case "rb-f": { const x = S.stack[S.stack.length - 1].draft.ex[+d.i]; x[d.f] = el.value === "" ? undefined : num(el.value); break; }
    case "sd": S.sheet.draft[d.f] = el.value; break;
    case "sd-dur": S.sheet.draft.exercises[+d.e].duration = num(el.value) || 0; break;
    case "sd-set": { const s = S.sheet.draft.exercises[+d.e].sets[+d.s]; if (d.f === "kind") s.kind = el.value; else if (d.f === "rir") { if (el.value === "") delete s.rir; else s.rir = +el.value; } else if (d.f === "band") s.band = el.value; else s[d.f] = num(el.value) || 0; break; }
  }
});
/* while a set box has focus, hide the rest dock and tab bar so they can't ride up over the keyboard and cover the row [untested on a real phone] */

/* ===== Mockup index (screen switcher) ===== */
function demoGino(stage) {
  S.person = "gino"; S.theme = S.theme || "original"; S.stack = []; S.sheet = null; S.lib.pick = null; S.view = "today";
  const sess = startSession(S.routines.find((r) => r.id === "r-la"));
  sess.startedAt = now() - 19 * 60000;
  const t0 = sess.startedAt;
  const squat = sess.exercises[0];
  const fill = (e, si, w, r, rir, ago) => { const s = e.sets[si]; s.w = w === null ? "" : String(w); s.r = String(r); s.rir = rir; s.done = true; s.doneAt = now() - ago * 1000; };
  fill(squat, 0, 45, 10, null, 900); fill(squat, 1, 135, 5, null, 780); fill(squat, 2, 185, 3, null, 640);
  fill(squat, 3, 235, 5, 1, 25);
  S.rest = { endsAt: now() + 155000, total: 180000, alerted: false, label: "Barbell back squat" };
  if (stage === "rir") { S.rirOpen = { e: 0, s: 3 }; squat.sets[3].rir = null; }
  if (stage === "superset" || stage === "finish") {
    // tick times run in order: warm-ups, then work sets, then the next exercises
    fill(squat, 0, 45, 10, null, 1500); fill(squat, 1, 135, 5, null, 1380); fill(squat, 2, 185, 3, null, 1260);
    fill(squat, 3, 235, 5, 1, 1100); fill(squat, 4, 235, 5, 1, 1000); fill(squat, 5, 235, 5, 0, 900);
    const rdl = sess.exercises[1]; fill(rdl, 0, 225, 8, 2, 700); fill(rdl, 1, 225, 8, 1, 560); fill(rdl, 2, 225, 7, 1, 420);
    const curl = sess.exercises[2]; fill(curl, 0, 120, 12, 1, 60);
    sess.startedAt = now() - 41 * 60000;
    S.rest = null; S.rirOpen = null;
    if (stage === "finish") { const calf = sess.exercises[3]; fill(calf, 0, 200, 15, 1, 40); curl.sets[1].w = "120"; curl.sets[1].r = "11"; }
  }
  void t0;
  for (const e of sess.exercises) { e.sets.forEach((s) => { s.rec = null; }); const ex = exOf(e.name); const prior = priorSetsFor(e.name, "gino", TODAY); for (const s of e.sets) { if (!s.done || s.kind === "warmup") continue; const st = toStoredSet(s, ex); s.rec = recordCheck(prior.slice(), st, ex); prior.push(st); } }
  return sess;
}
