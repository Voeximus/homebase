<!-- MOCKUP ONLY. Self-contained: no network requests, no storage, no Supabase. Example data. Built 2026-09-12. -->
<style>
/* ===== Base: Tailwind v4 preflight subset + src/index.css (quoted from the look extract) ===== */
:root {
  color-scheme: dark;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
  --color-mint: #46d18a; --color-gold: #e3b341; --color-ember: #e5544e; --color-white: #fff;
  --mc-p: #d55181; --mc-c: #3987e5; --mc-f: #c98500;
  --h-good: #199e70; --h-over: #e66767;
  --h-1: 6px; --h-2: 10px; --h-3: 14px; --h-4: 20px;
  --frame: 430px;
  --tabs-h: 59px;
}
/* Calm (default, "original") */
.htheme, .htheme[data-htheme="original"] {
  --color-bg: #101319; --color-tile: #161b26; --color-raised: #1c222e; --color-well: #0d1015;
  --color-hero: #161b26; --color-edge: #262d3a; --color-edgehero: #2b3342;
  --color-bone: #e9edf3; --color-taupe: #9aa5b4; --color-faint: #8a95a6;
  --color-accent: #34d399; --h-on-accent: #06231a; --h-hl: #313a49;
  --h-num-font: var(--font-sans); --h-radius: 18px; --h-hero-size: 44px; --h-disp-w: 750; --h-disp-ls: -1.6px;
  --h-stat-size: 23px; --h-lbl-ls: 0.06em; --h-lbl-tr: uppercase;
}
.htheme[data-htheme="instrument"] {
  --color-bg: #080b0e; --color-tile: #0e1419; --color-raised: #131b21; --color-well: #070a0d;
  --color-hero: #0e1419; --color-edge: #1c2731; --color-edgehero: #203039;
  --color-bone: #dde7ec; --color-taupe: #8ca0ab; --color-faint: #7e929d;
  --color-accent: #22d3ee; --h-on-accent: #041d24; --h-hl: #2a3b45;
  --h-num-font: var(--font-mono); --h-radius: 13px; --h-hero-size: 38px; --h-disp-w: 600; --h-disp-ls: -1.2px;
  --h-stat-size: 21px; --h-lbl-ls: 0.1em; --h-lbl-tr: uppercase;
}
.htheme[data-htheme="bold"] {
  --color-bg: #0d0e12; --color-tile: #171a22; --color-raised: #1f232d; --color-well: #0a0b0e;
  --color-hero: #171a22; --color-edge: #2c3340; --color-edgehero: #333b4a;
  --color-bone: #f3f6f9; --color-taupe: #a6b1bd; --color-faint: #939eab;
  --color-accent: #a3e635; --h-on-accent: #17230a; --h-hl: #3d4658;
  --h-num-font: var(--font-sans); --h-radius: 22px; --h-hero-size: 54px; --h-disp-w: 820; --h-disp-ls: -2.2px;
  --h-stat-size: 27px; --h-lbl-ls: 0.05em; --h-lbl-tr: uppercase;
}
*, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; border: 0 solid; }
html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; font-family: var(--font-sans); -webkit-tap-highlight-color: transparent; }
html, body { min-height: 100%; }
body {
  margin: 0; font-family: var(--font-sans); font-size: 15px; line-height: 1.5; letter-spacing: -0.006em;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility;
  color: #eef2f7; background-color: #0a0d12; overscroll-behavior-y: none; touch-action: manipulation;
}
img, svg { display: block; vertical-align: middle; }
p { margin: 0; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
button, input, textarea, select { font: inherit; letter-spacing: inherit; color: inherit; border-radius: 0; background-color: transparent; opacity: 1; }
button { appearance: button; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; cursor: pointer; text-align: inherit; }
::placeholder { opacity: 1; color: var(--color-faint); }
textarea { resize: none; }
input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.htheme .num { font-family: var(--h-num-font); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ===== Mockup index strip (NOT app UI) ===== */
.lab { background: #000; border-bottom: 1px dashed var(--color-gold); color: var(--color-gold); font: 600 11px/1.3 var(--font-mono); }
.lab-in { max-width: var(--frame); margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 4px 10px; min-height: 44px; }
.lab-in b { font-weight: 700; letter-spacing: .08em; }
.lab button { min-height: 36px; padding: 0 10px; border: 1px dashed var(--color-gold); border-radius: 6px; color: var(--color-gold); font: 600 11px var(--font-mono); }
.lab-panel { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.7); display: flex; justify-content: center; align-items: flex-start; padding: 10px; overflow-y: auto; }
.lab-card { width: 100%; max-width: 420px; background: #000; border: 1px dashed var(--color-gold); border-radius: 10px; padding: 12px; color: #f2e3b8; font: 12px/1.4 var(--font-mono); }
.lab-card h2 { color: var(--color-gold); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; margin: 12px 0 6px; }
.lab-card h2:first-child { margin-top: 0; }
.lab-card .row { display: flex; flex-wrap: wrap; gap: 6px; }
.lab-card button { min-height: 40px; padding: 6px 10px; border: 1px solid #5c4a1a; border-radius: 6px; color: #f2e3b8; text-align: left; font: 12px/1.3 var(--font-mono); }
.lab-card button.on { border-color: var(--color-gold); color: var(--color-gold); }
.lab-card .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.lab-card p { color: #cbbd95; margin-top: 8px; }

/* ===== App root + frame ===== */
.htheme { min-height: 100vh; background: var(--color-bg); color: var(--color-bone); }
.frame { max-width: var(--frame); margin: 0 auto; position: relative; min-height: 100vh; border-left: 1px solid var(--color-edge); border-right: 1px solid var(--color-edge); }
@media (max-width: 440px) { .frame { border: 0; } }
.hv-header { border-bottom: 1px solid var(--color-edge); }
.hv-header-in { margin: 0 auto; display: flex; height: 56px; max-width: 640px; align-items: center; gap: 8px; padding: 0 16px; }
.hv-spacer { min-width: 0; flex: 1; }
.hv-iconbtn { display: grid; place-items: center; height: 40px; width: 40px; border-radius: 9999px; color: var(--color-taupe); }
.hv-main { margin: 0 auto; max-width: 640px; padding: 12px 16px calc(88px + env(safe-area-inset-bottom)); }
.hv-main.with-dock { padding-bottom: calc(180px + env(safe-area-inset-bottom)); }
.hv-main.with-dock.tall { padding-bottom: calc(250px + env(safe-area-inset-bottom)); }
.mt { display: flex; flex-shrink: 0; align-items: center; gap: 2px; border-radius: 9999px; background: var(--color-raised); padding: 2px; }
.mt button { display: flex; align-items: center; gap: 6px; border-radius: 9999px; padding: 6px 10px; font-size: 12px; font-weight: 500; color: var(--color-taupe); }
.mt button.on-health { background: #fb7185; color: #fff; }
.mt svg { width: 14px; height: 14px; }

.h-tabs { position: fixed; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--frame); bottom: 0; z-index: 40; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
  padding: 6px 10px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--color-bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--color-edge); }
.h-tabs button { display: grid; place-items: center; gap: 2px; min-height: 46px; padding: 4px 0; border-radius: 12px; color: var(--color-faint); font-size: 10.5px; font-weight: 650; transition: color .15s; }
.h-tabs button svg { width: 19px; height: 19px; }
.h-tabs button.on { color: var(--color-accent); }

.stack { display: flex; flex-direction: column; gap: 12px; padding-bottom: 32px; }
.hb-ctl { display: flex; align-items: center; gap: var(--h-2); }
.h-seg { display: inline-flex; background: var(--color-well); border: 1px solid var(--color-edge); border-radius: 11px; padding: 3px; gap: 2px; }
.h-seg.full { display: flex; width: 100%; }
.h-seg button { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 36px; padding: 0 11px; white-space: nowrap; border-radius: 8px; color: var(--color-taupe); font-size: 12.5px; font-weight: 650; transition: color .15s, background .15s; }
.h-seg.full button { flex: 1; padding: 0 4px; }
.h-seg button svg { width: 14px; height: 14px; }
.h-seg button.on { background: var(--color-raised); color: var(--color-bone); box-shadow: inset 0 0 0 1px var(--color-edge); }
.h-seg button::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%); }

.h-eyebrow { font-family: var(--h-num-font); font-size: 10.5px; font-weight: 700; letter-spacing: var(--h-lbl-ls); text-transform: var(--h-lbl-tr); color: var(--color-taupe); display: flex; align-items: center; gap: var(--h-1); }
.h-eyebrow svg { width: 13px; height: 13px; color: var(--color-faint); }
.h-display { font-family: var(--h-num-font); font-size: var(--h-hero-size); font-weight: var(--h-disp-w); letter-spacing: var(--h-disp-ls); line-height: 0.95; font-variant-numeric: tabular-nums; color: var(--color-bone); }
.h-stat { font-family: var(--h-num-font); font-size: var(--h-stat-size); font-weight: var(--h-disp-w); letter-spacing: -0.4px; font-variant-numeric: tabular-nums; color: var(--color-bone); }
.h-stat .un { font-family: var(--font-sans); font-size: 11.5px; font-weight: 600; letter-spacing: 0; color: var(--color-taupe); }
.h-sub { font-size: 11.5px; color: var(--color-taupe); font-variant-numeric: tabular-nums; }
.hb-tiny { font-size: 10.5px; color: var(--color-taupe); font-variant-numeric: tabular-nums; }
.seclabel { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-taupe); }

.h-panel { background: var(--color-tile); border: 1px solid var(--color-edge); border-radius: var(--h-radius); padding: var(--h-3); color: var(--color-bone); }
.hb-tile { background: var(--color-tile); border: 1px solid var(--color-edge); border-radius: var(--h-radius); padding: var(--h-3); text-align: left; transition: border-color .16s, transform .12s; color: var(--color-bone); width: 100%; display: block; }
.hb-tile:hover { border-color: var(--h-hl); }
.hb-tile:active { transform: scale(.985); }

.sticky-top { position: sticky; z-index: 30; top: calc(env(safe-area-inset-top, 0px) + 6px); }
.h-hero { background: var(--color-hero); border: 1px solid var(--color-edgehero); border-radius: var(--h-radius); padding: var(--h-3) var(--h-3) var(--h-2); position: relative; overflow: hidden; }
.h-hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: linear-gradient(90deg, var(--color-accent), color-mix(in srgb, var(--color-accent) 25%, transparent)); }
.h-herorow { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--h-3); }
.h-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: var(--h-2); }
.h-week .d { height: 22px; border-radius: 6px; background: var(--color-well); box-shadow: inset 0 0 0 1px var(--color-edge); }
.h-week .d.on { background: var(--h-good); box-shadow: none; }
.h-week .d.today { box-shadow: inset 0 0 0 1.5px var(--color-accent); }
.h-week .d.on.today { box-shadow: inset 0 0 0 1.5px var(--color-accent); }
.h-week-lbls { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 5px; }
.h-week-lbls span { text-align: center; font-size: 9px; color: var(--color-faint); }

.h-cardhead { display: flex; align-items: center; gap: var(--h-2); margin-bottom: var(--h-2); }
.h-cardhead .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--color-raised); color: var(--color-taupe); box-shadow: inset 0 0 0 1px var(--color-edge); }
.h-cardhead .ic svg { width: 14px; height: 14px; }
.h-cardhead .t { font-size: 13.5px; font-weight: 700; color: var(--color-bone); }
.h-cardhead .s { font-size: 11px; color: var(--color-taupe); font-variant-numeric: tabular-nums; }
.h-hit { position: relative; isolation: isolate; }
.h-hit::after { content: ""; position: absolute; left: 50%; top: 50%; width: max(100%, 44px); height: max(100%, 44px); transform: translate(-50%, -50%); }

.h-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--h-1); width: 100%; min-height: 44px; padding: 0 var(--h-3); border-radius: 12px; font-size: 13.5px; font-weight: 700; transition: filter .15s, transform .1s; background: var(--color-accent); color: var(--h-on-accent); text-align: center; }
.h-btn:active { transform: scale(.985); }
.h-btn svg { width: 15px; height: 15px; }
.h-btn.quiet { background: var(--color-raised); color: var(--color-bone); box-shadow: inset 0 0 0 1px var(--color-edge); }
.h-btn.ghost { background: transparent; color: var(--color-accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--color-accent) 40%, transparent); }
.h-btn.danger { background: var(--h-over); color: var(--color-bg); }
.h-btn[disabled] { opacity: .45; cursor: default; }
.h-link { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--color-taupe); padding: 6px 0; min-height: 44px; }
.h-link svg { width: 13px; height: 13px; }
.h-link:hover { color: var(--color-bone); }
.h-link.on { color: var(--color-accent); }

.routines { display: flex; flex-direction: column; gap: 8px; }
.routine { display: flex; align-items: center; gap: 4px; }
.routine-btn { display: flex; min-width: 0; flex: 1; align-items: center; gap: 8px; border-radius: 12px; padding: 0 12px; text-align: left; background: var(--color-raised); border: 1px solid var(--color-edge); min-height: 52px; }
.routine-btn svg { width: 14px; height: 14px; color: var(--color-accent); flex: none; }
.routine-name { display: block; font-size: 13.5px; font-weight: 600; color: var(--color-bone); }
.routine-meta { display: block; font-size: 10.5px; color: var(--color-taupe); }
.iconbtn { display: grid; place-items: center; height: 44px; width: 44px; border-radius: 10px; color: var(--color-faint); flex: none; }
.iconbtn svg { width: 16px; height: 16px; }

.lrow { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--color-edge); padding: 8px 0; min-height: 44px; width: 100%; text-align: left; }
.lrow:last-child { border-bottom-width: 0; }
.lrow .name { min-width: 0; flex: 1; font-size: 13px; color: var(--color-bone); }
.lrow .meta { display: block; font-size: 10.5px; color: var(--color-taupe); }
.lrow .val { flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: var(--color-bone); }
.lrow .aux { flex-shrink: 0; text-align: right; font-size: 11px; color: var(--color-taupe); }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; padding: 4px 0; margin-top: -4px; margin-bottom: -4px; scrollbar-width: none; }
.chips.scroll::-webkit-scrollbar { display: none; }
.qchip { position: relative; flex: none; border-radius: 9999px; padding: 0 12px; min-height: 36px; display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; background: var(--color-raised); color: var(--color-taupe); box-shadow: inset 0 0 0 1px var(--color-edge); white-space: nowrap; }
.qchip.on { background: var(--color-accent); color: var(--h-on-accent); box-shadow: none; }
.qchip svg { width: 13px; height: 13px; }
.qchip i { font-style: normal; font-weight: 500; color: var(--color-faint); }
.qchip.on i { color: var(--h-on-accent); }
.preset { flex: 1; border-radius: 8px; min-height: 44px; font-size: 12px; font-weight: 600; background: var(--color-tile); border: 1px solid var(--color-edge); color: var(--color-taupe); text-align: center; }
.preset.on { background: var(--color-accent); color: var(--h-on-accent); border-color: var(--color-accent); }
.tag { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 6px; font-size: 10px; font-weight: 700; letter-spacing: .03em; color: var(--color-bone); box-shadow: inset 0 0 0 1px var(--color-taupe); white-space: nowrap; }
.tag.solid { background: var(--color-bone); color: var(--color-bg); box-shadow: none; }

/* forms */
.flabel { display: block; margin-bottom: 4px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-taupe); }
.tinput { width: 100%; border-radius: 8px; padding: 10px 12px; min-height: 44px; font-size: 14px; color: var(--color-bone); outline: none; background: var(--color-tile); border: 1px solid var(--color-edge); }
.tarea { width: 100%; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--color-bone); background: var(--color-tile); border: 1px solid var(--color-edge); }
.search { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 0 4px 0 12px; background: var(--color-tile); border: 1px solid var(--color-edge); }
.search > svg { width: 16px; height: 16px; color: var(--color-faint); flex: none; }
.search input { width: 100%; background: transparent; padding: 10px 0; min-height: 44px; font-size: 14px; color: var(--color-bone); outline: none; }
.switchrow { display: flex; align-items: center; gap: 10px; min-height: 48px; width: 100%; text-align: left; }
.switchrow .lbl { flex: 1; font-size: 13px; color: var(--color-bone); }
.switchrow .lbl small { display: block; font-size: 11px; color: var(--color-taupe); }
.sw { width: 40px; height: 24px; border-radius: 99px; background: var(--color-well); box-shadow: inset 0 0 0 1px var(--color-edge); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: var(--color-taupe); transition: transform .15s; }
.sw.on { background: var(--color-accent); box-shadow: none; }
.sw.on::after { transform: translateX(16px); background: var(--h-on-accent); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; height: 44px; border-radius: 9999px; background: var(--color-tile); border: 1px solid var(--color-edge); color: var(--color-bone); display: grid; place-items: center; }
.stepper button svg { width: 16px; height: 16px; }
.stepper .v { min-width: 44px; text-align: center; font-size: 16px; font-weight: 700; }

/* ===== Active session ===== */
.sessbar { padding: 10px var(--h-3) 10px; }
.sessbar .row { display: flex; align-items: center; gap: 8px; }
.sessname { font-size: 15px; font-weight: 700; color: var(--color-bone); min-width: 0; text-align: left; min-height: 44px; display: flex; align-items: center; gap: 6px; }
.sessname svg { width: 12px; height: 12px; color: var(--color-faint); flex: none; }
.slimbar { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 6px 0 12px; border-radius: 12px; background: var(--color-raised); border: 1px solid var(--color-edge); font-size: 12.5px; color: var(--color-taupe); }
.slimbar b { color: var(--color-bone); font-weight: 600; }
.exblock { border-radius: 12px; padding: 10px 10px 8px 12px; background: var(--color-raised); border: 1px solid var(--color-edge); position: relative; scroll-margin-top: 150px; }
.exblock.ss { box-shadow: inset 2px 0 0 var(--color-taupe); }
.exhead { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
.exname { font-size: 14px; font-weight: 600; color: var(--color-bone); text-align: left; display: block; min-height: 24px; }
.exlast { font-size: 13px; color: var(--color-taupe); }
.setcols, .setrow { display: grid; grid-template-columns: 28px minmax(0,1fr) minmax(0,1fr) 48px; gap: 6px; align-items: center; }
.setcols.onecol, .setrow.onecol { grid-template-columns: 28px minmax(0,1fr) 48px; }
.setcols { padding: 2px 0 2px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-faint); text-align: center; }
.kindlegend { font-size: 11px; color: var(--color-taupe); padding: 0 0 2px; }
.setrow { padding: 3px 0; }
.setrow input { scroll-margin-top: 100px; scroll-margin-bottom: 140px; }
.recmark { position: absolute; top: -3px; right: -3px; width: 16px; height: 16px; border-radius: 99px; display: none; place-items: center; background: var(--color-bone); color: var(--color-bg); }
.recmark.on { display: grid; }

"use strict";
/* ---- math.js ---- */
/* ===== training maths (SPEC §5) — pure functions ===== */
const M = {
  e1rmPlain(w, r) {
    if (!(w > 0) || r < 1 || r > 15) return null;
    const v = r === 1 ? w : w * (1 + r / 30);
    return { v, quality: r <= 10 ? "ok" : "rough", effortKnown: false };
  },
  e1rmAdjusted(w, r, rir, kind) {
    if (kind === "failure") rir = 0;
    if (rir === undefined || rir === null) {
      const p = M.e1rmPlain(w, r);
      return p ? { ...p, effortKnown: false } : null;
    }
    if (!(w > 0) || r < 1) return null;
    if (rir >= 4) return null;
    const rtf = r + rir;
    if (rtf > 10) return null;
    return { v: rtf === 1 ? w : w * (1 + rtf / 30), quality: "ok", effortKnown: true, rtf };
  },
  errorBandPercent(rtf) { return 100 / (30 + rtf); },
  isDone(s) { return s.done !== undefined ? s.done : s.reps > 0; },
  kindOf(s) { return s.kind || "working"; },
  isWorking(s) { return M.kindOf(s) !== "warmup"; },
  hard(s) { return M.isWorking(s) && M.isDone(s) && (s.rir === undefined || s.rir === null || s.rir <= 3); },
  /* Band edges for fractional values [convention]: 0 < v < 4 below; 4 <= v < 5 minimum; 5 <= v <= 10; 10 < v <= 18; 18 < v < 30; 30 <= v < 43; 43+ */
  bandLabel(v) {
    if (v === 0) return "None";
    if (v < 4) return "Below the studies' lowest band";
    if (v < 5) return "The studies' minimum band";
    if (v <= 10) return "Higher return for each set";
    if (v <= 18) return "Middle return for each set";
    if (v < 30) return "Lower return for each set · few studies went past about 25 sets";
    if (v < 43) return "Lowest return for each set · few studies went past about 25 sets";
    return "Not enough studies to say";
  },
  /* elapsed time in words, so it can't be read as a clock time */
  fmtElapsed(ms) {
    const m = Math.max(0, Math.floor(ms / 60000));
    if (m < 60) return `${m} min`;
    return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")} min`;
  },
  restDefault(ex, target) {
    if (!ex) return 90;
    if (ex.mode === "cardio") return 0;
    if (ex.mode === "bodyweight" || ex.mode === "band" || ex.mode === "timed") return 60;
    if (target && target.repsHi && target.repsHi <= 5) return 180;
    if (ex.type === "compound") return 120;
    return 90;
  },
  toKg(lb) { return lb * 0.45359237; },
  toLb(kg) { return kg / 0.45359237; },
  /* plates: fewest plates, heaviest innermost on ties, inventory-bounded (formula-13, PL2) */
  plates(target, opt) {
    const o = Object.assign({ bar: 45, collar: 0, list: [45, 35, 25, 10, 5, 2.5], owned: null }, opt || {});
    const list = o.list.slice().sort((a, b) => b - a);
    const small = list[list.length - 1];
    const fixed = o.bar + 2 * o.collar;
    const step = 2 * small;
    const solve = (perSide) => {
      const units = Math.round(perSide / small);
      const pu = list.map((p) => Math.round(p / small));
      let best = null;
      const better = (a, b) => {
        if (!b) return true;
        if (a.length !== b.length) return a.length < b.length;
        for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return a[i] > b[i];
        return false;
      };
      const cur = [];
      const dfs = (i, rem) => {
        if (best && cur.length > best.length) return;
        if (rem === 0) { const c = cur.slice(); if (better(c, best)) best = c; return; }
        if (i >= list.length) return;
        const maxC = Math.min(Math.floor(rem / pu[i]), o.owned ? (o.owned[list[i]] || 0) : Infinity);
        for (let c = maxC; c >= 0; c--) {
          for (let k = 0; k < c; k++) cur.push(list[i]);
          dfs(i + 1, rem - c * pu[i]);
          for (let k = 0; k < c; k++) cur.pop();
        }
      };
      dfs(0, units);
      return best;
    };
    let n = Math.floor((target - fixed) / step + 0.5);
    if (n < 0) n = 0;
    const loadable = fixed + step * n;
    const exact = solve((loadable - fixed) / 2);
    if (exact) return { loadable, perSide: exact, fixed, exactTarget: loadable === target };
    let below = null, above = null;
    for (let k = n - 1; k >= 0; k--) { const s = solve((step * k) / 2); if (s) { below = { loadable: fixed + step * k, perSide: s }; break; } }
    for (let k = n + 1; k < n + 200; k++) { const s = solve((step * k) / 2); if (s) { above = { loadable: fixed + step * k, perSide: s }; break; } }
    return { loadable, perSide: null, fixed, below, above };
  },
};

he band pulls hardest near the end of the pull where it is most stretched.","appUse":null,"showOn":[{"exercise":"Band row","as":"this"}],"range":{"exercise":"Band row","track":"tension","zone":"end"},"sources":[{"c":"Uchida MC, et al. Thera-band elastic band tension: reference values for physical activity. J Phys Ther Sci. 2016.","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4868225/"}]},{"id":"plank-long-lever","kind":"exercise","grade":"B","claim":"In one EMG study of 19 people doing 30-second holds, moving the elbows further forward and tucking the pelvis under raised abdominal activity compared with a standard plank, with the elbows-forward change contributing more.","appUse":null,"showOn":[{"exercise":"Plank","as":"this"}],"range":null,"sources":[{"c":"Schoenfeld BJ, Contreras B, Tiryaki-Sonmez G, Willardson JM, Fontana F. An electromyographic comparison of a modified version of the plank with a long lever and posterior tilt versus the traditional plank exercise. Sports Biomech. 2014;13(3):296-306. doi:10.1080/14763141.2014.942355","u":"https://europepmc.org/article/MED/25325773"}]},{"id":"plank-anatomy","kind":"exercise","grade":"C","claim":"The plank trains the abs and obliques by holding the lower back from sagging, rather than by bending the spine like a crunch.","appUse":null,"showOn":[{"exercise":"Plank","as":"this"}],"range":null,"sources":[]},{"id":"ab-spot-reduction-myth","kind":"exercise","grade":"A","claim":"Myth check: in one 6-week randomized trial of 24 sedentary adults eating a steady-calorie diet, ab exercises five days a week did not reduce belly fat, skinfolds or waist size compared with doing nothing, though ab endurance improved.","appUse":null,"showOn":[{"category":"muscle:core","as":"category"}],"range":null,"sources":[{"c":"Vispute SS, Smith JD, LeCheminant JD, Hurley KS. The effect of abdominal exercise on abdominal fat. J Strength Cond Res. 2011;25(9):2559-2564. doi:10.1519/jsc.0b013e3181fb4a46","u":"https://europepmc.org/article/MED/21804427"}]},{"id":"pulldown-grip-width-myth","kind":"exercise","grade":"B","claim":"Myth check: in EMG studies, wide-grip pulldowns did not switch on the lats more than medium or narrow grips over the whole rep (one study found slightly more lat activity with a wide grip only on the way back up); no study we found has tested whether grip width changes how the back grows.","appUse":null,"showOn":[{"exercise":"Lat pulldown","as":"this"},{"exercise":"Wide-grip lat pulldown","as":"this"},{"exercise":"Close-grip lat pulldown","as":"this"}],"range":null,"sources":[{"c":"Andersen V, Fimland MS, Wiik E, Skoglund A, Saeterbakken AH. Effects of grip width on muscle strength and activation in the lat pull-down. J Strength Cond Res. 2014;28(4):1135-1142. doi:10.1097/jsc.0000000000000232","u":"https://europepmc.org/article/MED/24662157"},{"c":"Buonsenso A, Di Fonza D, Di Claudio G, et al. Electromyographic Analysis of Back Muscle Activation During Lat Pulldown Exercise: Effects of Grip Variations and Forearm Orientation. J Funct Morphol Kinesiol. 2025;10(3):345. doi:10.3390/jfmk10030345","u":"https://europepmc.org/article/MED/40981044"},{"c":"Lusk SJ, Hale BD, Russell DM. Grip width and forearm orientation effects on muscle activity during the lat pull-down. J Strength Cond Res. 2010;24(7):1895-1900. doi:10.1519/jsc.0b013e3181ddb0ab","u":"https://europepmc.org/article/MED/20543740"}]},{"id":"pulldown-front","kind":"exercise","grade":"B","claim":"In two small EMG studies of trained men, pulling the bar down in front of the head gave more lat activity than behind the neck while pulling down, though one found behind-the-neck higher on the way back up; a 2026 review calls the front pulldown only tentatively the best-supported setup.","appUse":null,"showOn":[{"exercise":"Lat pulldown","as":"this"}],"range":null,"sources":[{"c":"Di Fonza D, Di Claudio G, Colantuono G, et al. Electromyographic Analysis of Latissimus Dorsi Activation During Common Resistance Training Exercises: A Narrative Review. J Funct Morphol Kinesiol. 2026;11(3):315. doi:10.3390/jfmk11030315","u":"https://europepmc.org/article/MED/42647355"}]},{"id":"pulling-grows-biceps","kind":"exercise","grade":"A","claim":"Pulling exercises grow the biceps too, but studies disagree on whether curls add more: pulldowns matched curls in one study, while curls grew the arm about twice as much as rows in another.","appUse":null,"showOn":[{"exercise":"Lat pulldown","as":"this"},{"exercise":"One-arm dumbbell row","as":"this"},{"exercise":"Dumbbell curl","as":"variation"},{"exercise":"Barbell curl","as":"variation"}],"range":null,"sources":[{"c":"Gentil P, Soares S, Bottaro M. Single vs. Multi-Joint Resistance Exercises: Effects on Muscle Strength and Hypertrophy. Asian J Sports Med. 2015;6(2):e24057. doi:10.5812/asjsm.24057","u":"https://europepmc.org/article/MED/26446291"},{"c":"Mannarino P, Matta T, Lima J, Simão R, Freitas de Salles B. Single-Joint Exercise Results in Higher Hypertrophy of Elbow Flexors Than Multijoint Exercise. J Strength Cond Res. 2021;35(10):2677-2681. doi:10.1519/jsc.0000000000003234","u":"https://europepmc.org/article/MED/31268995"}]},{"id":"seated-row-elbows","kind":"exercise","grade":"B","claim":"In seated rows, a narrower grip and keeping the elbows closer to the body were each linked to higher lat activity, though they were tested separately.","appUse":null,"showOn":[{"exercise":"Seated cable row","as":"this"},{"exercise":"Wide-grip seated cable row","as":"this"}],"range":null,"sources":[{"c":"Di Fonza D, Di Claudio G, Colantuono G, et al. J Funct Morphol Kinesiol. 2026;11(3):315. doi:10.3390/jfmk11030315","u":"https://europepmc.org/article/MED/42647355"}]},{"id":"pullup-grip","kind":"exercise","grade":"B","claim":"In small EMG studies, changing pull-up grip made little difference to lat activity (an underhand grip mainly added biceps activity), so grip can reasonably be chosen for comfort, though that last part is advice, not a tested finding.","appUse":null,"showOn":[{"exercise":"Pull-up","as":"this"},{"exercise":"Chin-up","as":"this"},{"exercise":"Wide-grip pull-up","as":"this"},{"exercise":"Neutral-grip pull-up","as":"this"}],"range":null,"sources":[{"c":"Di Fonza D, Di Claudio G, Colantuono G, et al. J Funct Morphol Kinesiol. 2026;11(3):315. doi:10.3390/jfmk11030315","u":"https://europepmc.org/article/MED/42647355"}]},{"id":"overhead-press-anatomy","kind":"exercise","grade":"C","claim":"The overhead press works the front delts, side delts and triceps, with the upper chest helping more when pressing in front and the side and rear delts more when pressing behind the neck; the upper traps help rotate the shoulder blades.","appUse":null,"showOn":[{"exercise":"Barbell overhead press","as":"this"},{"exercise":"Seated barbell military press","as":"this"},{"exercise":"Dumbbell shoulder press","as":"variation"},{"exercise":"Machine shoulder press","as":"variation"}],"range":null,"sources":[{"c":"Coratella G, et al. Front Physiol. 2022. doi:10.3389/fphys.2022.825880","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC9354811/"}]},{"id":"lateral-raise-cable-vs-dumbbell","kind":"exercise","grade":"A","claim":"Myth check: cable and dumbbell lateral raises grew the side delts by similar amounts in trained lifters, even though cables keep more tension at the bottom.","appUse":null,"showOn":[{"exercise":"Dumbbell lateral raise","as":"this"},{"exercise":"Cable lateral raise","as":"this"}],"range":null,"sources":[{"c":"Larsen S, Wolf M, Schoenfeld BJ, et al. Dumbbell versus cable lateral raises for lateral deltoid hypertrophy: an experimental study. Front Physiol. 2025;16:1611468. doi:10.3389/fphys.2025.1611468","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12277279/"}]},{"id":"curl-stretched-range","kind":"exercise","grade":"A","claim":"Preacher curls done only in the straight-arm part of the movement (0–50°) grew the upper-arm flexors about 2.6 times more than curls done only in the bent-arm part (80–130°), in untrained adults over 5 weeks.","appUse":null,"showOn":[{"exercise":"Preacher curl","as":"this"},{"exercise":"Machine preacher curl","as":"variation"}],"range":null,"sources":[{"c":"Sato S, Yoshida R, Kiyono R, et al. Elbow Joint Angles in Elbow Flexor Unilateral Resistance Exercise Training Determine Its Effects on Muscle Strength and Thickness of Trained and Non-trained Arms. Front Physiol. 2021;12:734509. doi:10.3389/fphys.2021.734509","u":"https://europepmc.org/article/MED/34616309"},{"c":"Zabaleta-Korta A, Fernández-Peña E, Torres-Unda J, et al. Regional Hypertrophy: The Effect of Exercises at Long and Short Muscle Lengths in Recreationally Trained Women. J Hum Kinet. 2023;87:259-270. doi:10.5114/jhk/163561","u":"https://europepmc.org/article/MED/37559762"}]},{"id":"preacher-curl-partials-trained","kind":"exercise","grade":"A","claim":"In trained lifters, preacher curls done only in the bottom, stretched half grew the arm about as much as full-range preacher curls, with at most a small edge near the elbow.","appUse":null,"showOn":[{"exercise":"Preacher curl","as":"this"},{"exercise":"Machine preacher curl","as":"variation"}],"range":null,"sources":[{"c":"Havers T, Wagner N, Held S, Geisler S, Wiewelhove T. Partial Range, Full Gains? The Effect of 8 Weeks of Partial Range of Motion Training at Long Muscle Lengths on Elbow Flexor Hypertrophy and Strength in Trained Individuals. Eur J Sport Sci. 2025;25(12):e70087. doi:10.1002/ejsc.70087","u":"https://europepmc.org/article/MED/41247250"}]},{"id":"behind-body-curl-myth","kind":"exercise","grade":"A","claim":"Myth check: curling with the arm pulled back behind the body did not grow the biceps more than a normal cable curl when range and resistance were matched.","appUse":null,"showOn":[{"exercise":"Cable curl","as":"this"}],"range":null,"sources":[{"c":"Larsen S, Sandvik Kristiansen B, Østerås Sandberg N, et al. The effects of shoulder extension angle on elbow flexor hypertrophy in the cable curl exercise. Front Physiol. 2026;17:1750722. doi:10.3389/fphys.2026.1750722","u":"https://europepmc.org/article/MED/41988507"}]},{"id":"curl-mind-muscle","kind":"exercise","grade":"A","claim":"Focusing on squeezing the biceps grew the arm more (12.4% vs 6.9%) than focusing on just lifting the weight, but the same trick made no difference for the thighs.","appUse":null,"showOn":[{"exercise":"Barbell curl","as":"variation"},{"exercise":"Dumbbell curl","as":"variation"}],"range":null,"sources":[{"c":"Schoenfeld BJ, Vigotsky A, Contreras B, et al. Differential effects of attentional focus strategies during long-term resistance training. Eur J Sport Sci. 2018;18(5):705-712. doi:10.1080/17461391.2018.1447020","u":"https://europepmc.org/article/MED/29533715"}]},{"id":"overhead-triceps-growth","kind":"exercise","grade":"A","claim":"Overhead cable triceps extensions grew the whole triceps about 1.4 times more than pushdowns (about 20% vs 14%), even though lighter weights were used.","appUse":null,"showOn":[{"exercise":"Cable overhead triceps extension","as":"this"},{"exercise":"Triceps pushdown","as":"this"},{"exercise":"Overhead triceps extension","as":"variation"},{"exercise":"Rope triceps pushdown","as":"variation"}],"range":null,"sources":[{"c":"Maeo S, Wu Y, Huang M, et al. Triceps brachii hypertrophy is substantially greater after elbow extension training performed in the overhead versus neutral arm position. Eur J Sport Sci. 2023;23(7):1240-1250. doi:10.1080/17461391.2022.2100279","u":"https://europepmc.org/article/MED/35819335"}]},{"id":"pushdown-lateral-head-myth","kind":"exercise","grade":"A","claim":"Myth check: overhead extensions did not just grow the long head, because the lateral and medial heads that pushdowns supposedly target also grew more with overhead work.","appUse":null,"showOn":[{"exercise":"Triceps pushdown","as":"this"},{"exercise":"Cable overhead triceps extension","as":"this"},{"exercise":"Rope triceps pushdown","as":"variation"},{"exercise":"Overhead triceps extension","as":"variation"}],"range":null,"sources":[{"c":"Maeo S, Wu Y, Huang M, et al. Eur J Sport Sci. 2023;23(7):1240-1250. doi:10.1080/17461391.2022.2100279","u":"https://europepmc.org/article/MED/35819335"}]},{"id":"skull-crusher-anatomy","kind":"exercise","grade":"C","claim":"Lying triceps extensions put the upper arm partway overhead, which stretches the triceps long head more than a pushdown but less than a full overhead extension.","appUse":null,"showOn":[{"exercise":"Skullcrusher","as":"this"}],"range":{"exercise":"Skullcrusher","track":"length","zone":"middle"},"sources":[{"c":"Maeo S, Wu Y, Huang M, et al. Eur J Sport Sci. 2023;23(7):1240-1250 (mechanism only). doi:10.1080/17461391.2022.2100279","u":"https://europepmc.org/article/MED/35819335"}]},{"id":"lunge-emg","kind":"exercise","grade":"B","claim":"In barbell-loaded single-leg squats, forward lunges and lateral step-ups, two of the front-thigh muscles (vastus lateralis and medialis) showed the most activity, followed by the side and main glutes, while the rectus femoris front-thigh muscle ranked below the glutes.","appUse":null,"showOn":[{"exercise":"Barbell lunge","as":"this"},{"exercise":"Dumbbell lunge","as":"variation"},{"exercise":"Walking lunge","as":"variation"},{"exercise":"Reverse lunge","as":"variation"},{"exercise":"Step-up","as":"variation"}],"range":null,"sources":[{"c":"Muyor JM, Martín-Fuentes I, Rodríguez-Ridao D, Antequera-Vique JA. Electromyographic activity in the gluteus medius, gluteus maximus, biceps femoris, vastus lateralis, vastus medialis and rectus femoris during the Monopodal Squat, Forward Lunge and Lateral Step-Up exercises. PLoS One. 2020;15(4):e0230841. doi:10.1371/journal.pone.0230841","u":"https://europepmc.org/article/MED/32236133"}]},{"id":"lengthened-partials-general","kind":"exercise","grade":"A","claim":"Half reps done in the stretched part of a lift grew muscle about as well as full reps, not clearly better, so full range that includes the stretch is a safe default.","appUse":null,"showOn":[{"help":"science"}],"range":null,"sources":[{"c":"Wolf M, Androulakis-Korakakis P, Fisher J, Schoenfeld B, Steele J. Partial vs full range of motion resistance training: A systematic review and meta-analysis. Int J Strength Cond. 2023;3(1). doi:10.47206/ijsc.v3i1.182","u":"https://journal.iusca.org/index.php/Journal/article/view/182"},{"c":"Wolf M, Androulakis Korakakis P, Piñero A, et al. Lengthened partial repetitions elicit similar muscular adaptations as full range of motion repetitions during resistance training in trained individuals. PeerJ. 2025;13:e18904. doi:10.7717/peerj.18904","u":"https://europepmc.org/article/MED/39959841"}]},{"id":"regional-growth-general","kind":"exercise","grade":"A","claim":"Choosing stretched-position versus shortened-position training made only trivial differences to how much the top, middle or bottom of a muscle grew.","appUse":null,"showOn":[{"help":"science"}],"range":null,"sources":[{"c":"Varovic D, Wolf M, Schoenfeld BJ, Steele J, Grgic J, Mikulic P. Does Muscle Length Influence Regional Hypertrophy? A Systematic Review and Meta-Analysis. Int J Sports Med. 2025;46(14):1027-1036. doi:10.1055/a-2615-4935","u":"https://europepmc.org/article/MED/40570881"}]},{"id":"E1","kind":"training","grade":"C","claim":"Mayhew 2008 reviewed 14 published 1RM equations and said most of them give no evidence of who they were built from or how they were fitted; it does not say this about Epley or Brzycki by name, and it credits the w*(1+0.0333*r) form to Welday 1988, not Epley. Treat both as working conventions whose origin I have not checked.","appUse":"info:estimated-max","showOn":[],"range":null,"sources":[{"c":"Mayhew JL et al. J Strength Cond Res 2008;22(5):1570-1577","u":"https://www.unm.edu/~rrobergs/478PredictionAccuracy.pdf"}]},{"id":"E2","kind":"training","grade":"B","claim":"1RM estimates are more accurate from lower rep counts. In 70 adults (34 men, 36 women, aged 18-69), the fit was R^2 = 0.974 (leg press) and 0.993 (chest press) from a 5RM, dropping at 10RM and 20RM, and the authors advise no more than 10 reps. In 103 mostly untrained college women benching, Mayhew 2008 found predictions were more accurate below 10 reps to fatigue. A 2025 study in about 40 recreationally active men, tested only at 80% 1RM, recommended its two chosen equations for loads giving 4-10 reps to failure; it did not compare rep ranges.","appUse":"info:estimated-max","showOn":[],"range":null,"sources":[{"c":"Reynolds JM et al. J Strength Cond Res 2006;20(3):584-592","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Prediction%20of%20one%20repetition%20maximum%20strength%20from%20multiple%20repetition%20maximum%20testing%20and%20anthropometry%22&resultType=core&format=json"},{"c":"Mayhew JL et al. J Strength Cond Res 2008;22(5):1570-1577","u":"https://www.unm.edu/~rrobergs/478PredictionAccuracy.pdf"},{"c":"Cross-validation of equations for estimating 1RM from repetitions to failure for the bench press and leg extension. J Strength Cond Res 2025;39(2):e96-e105","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Cross-Validation%20of%20Equations%20for%20Estimating%201%20Repetition%20Maximum%20From%20Repetitions%20to%20Failure%22&resultType=core&format=json"}]},{"id":"E3","kind":"training","grade":"A","claim":"Nuzzo's meta-regression (269 studies, 7,289 people, 952 tests) found more reps in the leg press than the bench press at every load. At 70% 1RM the general model gives about 15 reps against 11 in the textbook table; bench about 14, leg press about 19. The spread between people is about 2.51 reps at 80% and 4.36 at 60%, so it grows as the load gets lighter.","appUse":"info:estimated-max","showOn":[],"range":null,"sources":[{"c":"Nuzzo JL et al. Maximal number of repetitions at percentages of the one repetition maximum: a meta-regression and moderator analysis. Sports Med 2024;54(2):303-321","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10933212/"}]},{"id":"E4","kind":"training","grade":"C","claim":"Putting Nuzzo's average reps into the equations: bench at 80% with about 9 reps gives Epley 1.04x and Brzycki 1.03x the true 1RM; leg press at 70% with about 19 reps gives 1.14x and 1.40x. So a generic equation with no rep cap or exercise correction will inflate leg-press and high-rep estimates for the average person. The multipliers are approximate, and the leg-press rep estimate itself has a wide range (14-26 reps at 70%).","appUse":"info:estimated-max","showOn":[],"range":null,"sources":[{"c":"Nuzzo JL et al. Sports Med 2024;54(2):303-321","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC10933212/"}]},{"id":"R1","kind":"training","grade":"B","claim":"On the RIR-based RPE scale, RPE 10 = 0 reps in reserve, 9 = 1, 8 = 2, 7 = 3, 5-6 = 4-6, and RIR ratings are recommended mainly for sets at RPE 7-10. In one study experienced squatters rated true 1RMs closer to 10 than novices (9.80 vs 8.96), and ratings tracked bar speed more closely in experienced lifters (r = -0.88 vs -0.77). In 15 powerlifters, RPE at 1RM was 9.6-9.7 and %1RM correlated with RPE at r = 0.88-0.91.","appUse":"info:effort","showOn":[],"range":null,"sources":[{"c":"Helms ER et al. Application of the RIR-based RPE scale for resistance training. Strength Cond J 2016","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4961270/"},{"c":"Helms ER et al. RPE and velocity relationships for the back squat, bench press, and deadlift in powerlifters. J Strength Cond Res 2017;31(2):292-297","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22RPE%20and%20Velocity%20Relationships%20for%20the%20Back%20Squat,%20Bench%20Press,%20and%20Deadlift%20in%20Powerlifters%22&resultType=core&format=json"}]},{"id":"R2","kind":"training","grade":"B","claim":"On average people think they have fewer reps left than they really do, by about 0.95 reps (95% CI 0.17-1.73), but results vary hugely between studies. Accuracy was clearly worse in sets longer than 12 reps. Being closer to failure and being in a later set helped only slightly (the closer-to-failure effect was not clearly different from zero). Training status made no difference.","appUse":"info:effort","showOn":[],"range":null,"sources":[{"c":"Halperin I et al. Sports Med 2022;52(2):377-390","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Accuracy%20in%20Predicting%20Repetitions%20to%20Task%20Failure%22&resultType=core&format=json"}]},{"id":"V1","kind":"training","grade":"A","claim":"Counting indirect (helper-muscle) sets as 0.5 predicted muscle growth and strength better than counting them as 1 or 0. Across 67 studies and 2,058 people, every Bayes factor favoured the half-set count, e.g. 2 x log(BF) = 9.48 against counting them fully and 10.29 against ignoring them, for volume and growth.","appUse":"info:weekly-sets","showOn":[],"range":null,"sources":[{"c":"Pelland JC et al. SportRxiv preprint 2024, section 4.4","u":"https://sportrxiv.org/index.php/server/preprint/download/460/967"},{"c":"Pelland JC et al. Sports Med 2026;56(2):481-505 (abstract)","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1007/s40279-025-02344-w&resultType=core&format=json"}]},{"id":"V2","kind":"training","grade":"C","claim":"The 0.5 weight was picked, not estimated; the authors say the method assumes every indirect set is worth half a set, and only 0, 0.5 and 1 were compared. Sorting sets into direct and indirect was 'not wholly objective'. In their table, rows and pulldowns were indirect for biceps; bench and overhead presses were indirect for triceps; bench and chest press were indirect for front delts (shoulder press was direct); squats and leg press were indirect for rectus femoris; pulldowns and rows were the only (indirect) sets for traps; hamstrings had only leg curls (direct) and nothing indirect.","appUse":"info:weekly-sets","showOn":[],"range":null,"sources":[{"c":"Pelland JC et al. SportRxiv preprint 2024, section 2.4, Table 1A, section 5.1","u":"https://sportrxiv.org/index.php/server/preprint/download/460/967"}]},{"id":"V3","kind":"training","grade":"A","claim":"More weekly sets gave more muscle growth, with diminishing returns and no clear plateau. A square-root curve fit best; the slope was 0.24% per set (CrI 0.15-0.33) at about 12 sets. Efficiency bands (preprint): 4 minimum; 5-10 higher; 11-18 intermediate; 19-29 lower; 30-42 lowest; 43+ unclear. Few studies went past about 25 sets, and at high volumes the data also fit a plateau. Schoenfeld 2017 found 0.37% per extra set, and ACSM 2026 says growth is better with at least 10 sets a week.","appUse":"info:weekly-sets","showOn":[],"range":null,"sources":[{"c":"Pelland JC et al. SportRxiv preprint 2024, section 4.6.1, Table 2A","u":"https://sportrxiv.org/index.php/server/preprint/download/460/967"},{"c":"Schoenfeld BJ, Ogborn D, Krieger JW. Dose-response relationship between weekly resistance training volume and increases in muscle mass. J Sports Sci 2017;35(11):1073-1082","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Dose-response%20relationship%20between%20weekly%20resistance%20training%20volume%20and%20increases%20in%20muscle%20mass%22&resultType=core&format=json"},{"c":"Currier BS et al. ACSM Position Stand. Med Sci Sports Exerc 2026;58(4):851-872","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=EXT_ID:41843416%20AND%20SRC:MED&resultType=core&format=json"}]},{"id":"P1","kind":"training","grade":"B","claim":"Muscle growth rose roughly in a straight line as sets ended closer to failure. Preprint slope: -0.48% muscle-size change per extra rep in reserve (CI -0.78 to -0.18). Strength gains were similar across a wide range of reps in reserve. The reps in reserve were estimated by the authors from study descriptions (e.g. 8 reps with a 10RM load = 2 in reserve), the analysis had no systematic search, and the authors call it exploratory.","appUse":"info:effort","showOn":[],"range":null,"sources":[{"c":"Robinson ZP et al. Exploring the dose-response relationship between estimated resistance training proximity to failure, strength gain, and muscle hypertrophy. SportRxiv preprint (updated Nov 2023)","u":"https://sportrxiv.org/index.php/server/preprint/download/295/699"},{"c":"Robinson ZP et al. Sports Med 2024;54(9):2209-2231 (abstract)","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1007/s40279-024-02069-2&resultType=core&format=json"}]},{"id":"P2","kind":"training","grade":"A","claim":"Training to momentary failure was not better than stopping short for muscle growth (ES 0.12, p = 0.343). Using any definition of failure there was only a trivial edge (ES 0.19, CI 0.00-0.37). ACSM 2026 says training to momentary fatigue did not consistently change outcomes for healthy adults.","appUse":"info:effort","showOn":[],"range":null,"sources":[{"c":"Refalo MC et al. Influence of resistance training proximity-to-failure on skeletal muscle hypertrophy. Sports Med 2023;53(3):649-665","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Influence%20of%20Resistance%20Training%20Proximity-to-Failure%20on%20Skeletal%20Muscle%20Hypertrophy%22&resultType=core&format=json"},{"c":"ACSM 2026 resistance training guidelines update","u":"https://acsm.org/resistance-training-guidelines-update-2026/"}]},{"id":"P3","kind":"training","grade":"C","claim":"Counting a set as 'hard' only at 3 or fewer reps in reserve (RPE 7+) is an app convention. It matches the range where RIR ratings are recommended. The volume meta-analyses counted every set regardless of effort, and about 78% of their effects came from protocols with some failure definition (only about 30% clearly meant momentary failure).","appUse":"info:weekly-sets","showOn":[],"range":null,"sources":[{"c":"Helms ER et al. Strength Cond J 2016","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4961270/"},{"c":"Pelland JC et al. SportRxiv preprint 2024, section 4.3","u":"https://sportrxiv.org/index.php/server/preprint/download/460/967"}]},{"id":"L2","kind":"training","grade":"B","claim":"Similar muscle growth is seen across loads of about 30% 1RM and up; in the one condition at 20% 1RM, gains were about half. High effort matters most with light loads, which also feel more uncomfortable. Moderate loads are the most time-efficient because light loads need many more reps.","appUse":"help:science","showOn":[],"range":null,"sources":[{"c":"Schoenfeld BJ et al. Loading recommendations for muscle strength, hypertrophy, and local endurance: a re-examination of the repetition continuum. Sports 2021;9(2):32","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7927075/"}]},{"id":"T1","kind":"training","grade":"A","claim":"Resting more than 60 s may give a small, uncertain growth benefit over 60 s or less (arm SMD 0.13, 74% probability above zero; thigh 0.17, 88%). The analysis found no clear extra benefit from resting beyond 90 s. The evidence is 9 small studies with 185 participants, 6 of the 9 in untrained people.","appUse":"info:rest","showOn":[],"range":null,"sources":[{"c":"Singer A et al. Front Sports Act Living 2024;6:1429789","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11349676/"}]},{"id":"T2","kind":"training","grade":"B","claim":"In 21 trained young men over 8 weeks (3 sets of 8-12RM, 7 exercises, 3 times a week), 3-minute rest gave larger squat and bench 1RM gains and more front-thigh growth than 1-minute rest.","appUse":"info:rest","showOn":[],"range":null,"sources":[{"c":"Schoenfeld BJ et al. J Strength Cond Res 2016;30(7):1805-1812","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Longer%20Interset%20Rest%20Periods%20Enhance%20Muscle%20Strength%20and%20Hypertrophy%20in%20Resistance-Trained%20Men%22&resultType=core&format=json"}]},{"id":"W1","kind":"training","grade":"B","claim":"A systematic review of 14 randomised trials in people with at least a year of training concluded that counting sets taken to or near failure 'seems to be' an adequate way to measure training volume for muscle growth across 6-20+ reps, if everything else is kept the same.","appUse":"info:weekly-sets","showOn":[],"range":null,"sources":[{"c":"Baz-Valle E et al. Total number of sets as a training volume quantification method for muscle hypertrophy: a systematic review. J Strength Cond Res 2021;35(3):870-878","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Total%20number%20of%20sets%20as%20a%20training%20volume%20quantification%20method%20for%20muscle%20hypertrophy%22&resultType=core&format=json"}]},{"id":"W2","kind":"training","grade":"C","claim":"Leave warm-up sets out of hard sets, volume load and PRs. They are deliberately far from failure, and the volume evidence counts sets taken to or near failure. No study tests this directly; it is reasoning.","appUse":"rule:trainingMath (warm-ups excluded everywhere)","showOn":[],"range":null,"sources":[{"c":"Baz-Valle E et al. J Strength Cond Res 2021;35(3):870-878","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Total%20number%20of%20sets%20as%20a%20training%20volume%20quantification%20method%20for%20muscle%20hypertrophy%22&resultType=core&format=json"}]},{"id":"W3","kind":"training","grade":"B","claim":"In 18 trained men, sets of 25-35 reps (light load) and 8-12 reps (heavy load), all to failure, gave similar growth (quads 9.5% vs 9.3%), even though the light-load group did roughly three times the reps per set. Strength favoured heavy loads (squat 19.6% vs 8.8%). The abstract does not report tonnage, so 'tonnage is a poor proxy for growth' is an inference from reps and load, not a measured result.","appUse":"rule:trainingMath (no cross-exercise tonnage score; the session 'vol' number is removed)","showOn":[],"range":null,"sources":[{"c":"Schoenfeld BJ et al. J Strength Cond Res 2015;29(10):2954-2963","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Effects%20of%20Low-%20vs.%20High-Load%20Resistance%20Training%20on%20Muscle%20Strength%20and%20Hypertrophy%20in%20Well-Trained%20Men%22&resultType=core&format=json"},{"c":"Schoenfeld BJ et al. J Strength Cond Res 2017;31(12):3508-3523","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Strength%20and%20Hypertrophy%20Adaptations%20Between%20Low-%20vs.%20High-Load%20Resistance%20Training%22&resultType=core&format=json"}]},{"id":"PR1","kind":"training","grade":"C","claim":"Only rep-max PRs (heaviest weight done for at least r reps) are measured records at any rep count. e1RM PRs are estimates and only fair when reps to failure are 10 or fewer and effort is known, because accuracy falls as reps rise and one misjudged rep moves e1RM by about 2.5-3.7% (Epley or Brzycki, 1-10 reps).","appUse":"info:records","showOn":[],"range":null,"sources":[{"c":"Reynolds JM et al. J Strength Cond Res 2006;20(3):584-592","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Prediction%20of%20one%20repetition%20maximum%20strength%20from%20multiple%20repetition%20maximum%20testing%20and%20anthropometry%22&resultType=core&format=json"}]},{"id":"PL1","kind":"training","grade":"C","claim":"IPF: bar plus collars must weigh 25 kg, and collars must weigh 2.5 kg each (so the bar is 20 kg). Competition discs are 1.25-25 kg, and lighter discs may be used for record attempts. Heavier discs go innermost. The 45 lb bar and US plates of 45/35/25/10/5/2.5 lb are gym convention with no standard opened.","appUse":"info:plates","showOn":[],"range":null,"sources":[{"c":"IPF Technical Rulebook 2026, section 2.3","u":"https://www.powerlifting.sport/fileadmin/ipf/data/rules/technical-rules/english/2026_IPF_Technical_Rulebook__effective_01_March_2026__v3.pdf"}]},{"id":"PL2","kind":"training","grade":"C","claim":"With lb plates [45,35,25,10,5,2.5], heaviest-plate-first does not always use the fewest plates: 60 per side gives 45+10+5 (3 plates) where 35+25 (2) works. Up to 300 lb per side this happens at 60, 62.5, 105, 107.5, 150, 152.5, 195, 197.5, 240, 242.5, 285 and 287.5. With IPF kg plates [25,20,15,10,5,2.5,1.25], heaviest-first was optimal for every load up to 200 kg per side (unlimited plates). With a limited plate inventory, heaviest-first can also miss a load that is possible (reasoning, not tested).","appUse":"rule:trainingMath.plates (test cases)","showOn":[],"range":null,"sources":[]},{"id":"PL3","kind":"training","grade":"C","claim":"1 avoirdupois pound = 0.45359237 kg exactly, so a 45 lb bar is 20.41 kg and a 20 kg bar is 44.09 lb. Store the unit the weight was entered in and don't convert back and forth.","appUse":"info:units","showOn":[],"range":null,"sources":[{"c":"NIST Handbook 44 (2026), Appendix B, p. B-12","u":"https://www.nist.gov/system/files/documents/2025/12/30/appb-26-HB44-20251210.pdf"}]},{"id":"formula-1","kind":"formula","grade":"B","claim":"Epley estimated 1RM: e1RM = w*(1 + r/30), with e1RM = w at r = 1 by convention (raw Epley gives 1.033w for a single). Mayhew 2008 lists this same form but credits it to Welday 1988; the Epley original was not opened and its derivation is undocumented. Trust it for 1-10 reps (Reynolds 2006); showing 11-15 as 'rough' and refusing above 15 or for w <= 0 are app conventions.","appUse":"trainingMath.e1rmPlain","showOn":[],"range":null,"sources":[{"c":"Mayhew JL et al. Accuracy of prediction equations for determining 1RM bench press in women before and after resistance training. J Strength Cond Res 2008;22(5):1570-1577. Table 2 lists this exact form, 1RM = (RTF x 0.0333) RepWt + RepWt, under 'Welday'.","u":"https://www.unm.edu/~rrobergs/478PredictionAccuracy.pdf"},{"c":"Reynolds JM, Gordon TJ, Robergs RA. Prediction of 1RM strength from multiple RM testing and anthropometry. J Strength Cond Res 2006;20(3):584-592.","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Prediction%20of%20one%20repetition%20maximum%20strength%20from%20multiple%20repetition%20maximum%20testing%20and%20anthropometry%22&resultType=core&format=json"}]},{"id":"formula-3","kind":"formula","grade":"C","claim":"RIR-adjusted e1RM: RIR = 10 - RPE; reps to failure RTF = r + RIR; e1RM_adj = w*(1 + RTF/30), with e1RM_adj = w if RTF = 1. Adding the estimated reps left into Epley is an app convention; no study validates it. If RIR is missing, compute plain Epley and tag it 'assumes near failure'. People tend to underestimate reps left by about 1 on average (with large study-to-study variation), which would make e1RM_adj about 2.5-3% low. Use only for RIR 0-3 and RTF <= 10; the RPE 7-10 range comes from Helms 2016, and closer to failure is only slightly more accurate.","appUse":"trainingMath.e1rmAdjusted","showOn":[],"range":null,"sources":[{"c":"Helms ER et al. Application of the RIR-based RPE scale for resistance training. Strength Cond J 2016.","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4961270/"},{"c":"Halperin I et al. Accuracy in predicting repetitions to task failure in resistance exercise: scoping review and exploratory meta-analysis. Sports Med 2022;52(2):377-390.","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Accuracy%20in%20Predicting%20Repetitions%20to%20Task%20Failure%22&resultType=core&format=json"}]},{"id":"formula-4","kind":"formula","grade":"C","claim":"e1RM sensitivity to one rep of error: Epley relative change per rep = 1/(30 + RTF); Brzycki = 1/(37 - RTF). Epley: RTF 5 gives 2.86% per rep, RTF 10 gives 2.50%. Brzycki: RTF 10 gives 3.70%, RTF 20 gives 5.88%, RTF 30 gives 14.3%. Pure calculus on the two formulas; use it to show an error band such as +/- 1 rep.","appUse":"trainingMath.e1rmErrorBand","showOn":[],"range":null,"sources":[]},{"id":"formula-6","kind":"formula","grade":"B","claim":"Weekly fractional hard sets per muscle: S_m = sum over sets of hard(s)*role(exercise, m); role = 1 for the main mover, 0.5 for a meaningful helper muscle, 0 otherwise (Pelland's 1/0.5/0 weights). hard(s) = working, completed, and RIR unknown or <= T (T = 3 by default; an app convention). Window = rolling 7 days. Show Pelland's growth bands as context: <4 below detectable; 4 minimum; 5-10 higher efficiency; 11-18 intermediate; 19-29 lower; 30-42 lowest; 43+ unclear. Caveats: Pelland counted all sets regardless of effort, and which exercises count as direct or indirect for each muscle is a judgement call.","appUse":"trainingMath.weeklyHardSets","showOn":[],"range":null,"sources":[{"c":"Pelland JC, Remmert JF, Robinson ZP, Hinson S, Zourdos MC. The resistance training dose-response: meta-regressions exploring the effects of weekly volume and frequency on muscle hypertrophy and strength gain. SportRxiv preprint (Sept 2024), sections 2.4, 4.4, Table 2A.","u":"https://sportrxiv.org/index.php/server/preprint/download/460/967"},{"c":"Pelland JC et al. Sports Med 2026;56(2):481-505, doi:10.1007/s40279-025-02344-w (published abstract).","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1007/s40279-025-02344-w&resultType=core&format=json"}]},{"id":"formula-9","kind":"formula","grade":"C","claim":"Volume load (tonnage) per exercise: sum over working sets of w*r, same unit only, excluding sets with w <= 0; warm-ups excluded; bodyweight and band sets reported as rep counts. Compare only within the same exercise and rep range over time, and never add it up across exercises as a growth score, because light and heavy loads to failure gave similar growth despite very different reps (Schoenfeld 2015). App convention built on that inference.","appUse":"trainingMath.volumeLoad","showOn":[],"range":null,"sources":[{"c":"Schoenfeld BJ et al. Effects of low- vs high-load resistance training on muscle strength and hypertrophy in well-trained men. J Strength Cond Res 2015;29(10):2954-2963.","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Effects%20of%20Low-%20vs.%20High-Load%20Resistance%20Training%20on%20Muscle%20Strength%20and%20Hypertrophy%20in%20Well-Trained%20Men%22&resultType=core&format=json"}]},{"id":"formula-12","kind":"formula","grade":"C","claim":"Default rest timer: 120 s for compound lifts, 90 s for isolation, editable, with an option of 180 s for heavy sets of 5 or fewer reps; warn if rest under 60 s on a growth-goal exercise. These defaults are app conventions. The evidence suggests a small, uncertain growth benefit from resting over 60 s, no clear extra benefit beyond 90 s, and one trial in trained men found 3 min beat 1 min for strength and thigh growth.","appUse":"trainingMath.defaultRest (the under-60-s warning is NOT built in v1)","showOn":[],"range":null,"sources":[{"c":"Singer A et al. Give it a rest: systematic review with Bayesian meta-analysis on inter-set rest interval duration and hypertrophy. Front Sports Act Living 2024;6:1429789.","u":"https://pmc.ncbi.nlm.nih.gov/articles/PMC11349676/"},{"c":"Schoenfeld BJ et al. Longer interset rest periods enhance muscle strength and hypertrophy in resistance-trained men. J Strength Cond Res 2016;30(7):1805-1812.","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Longer%20Interset%20Rest%20Periods%20Enhance%20Muscle%20Strength%20and%20Hypertrophy%20in%20Resistance-Trained%20Men%22&resultType=core&format=json"}]},{"id":"formula-13","kind":"formula","grade":"C","claim":"Plate loading: fixed = bar + 2 x collar; step = 2 x smallest plate; round the target to the nearest loadable weight, halve the remainder per side, and choose plates by a minimum-count search with inventory limits (heaviest innermost). lb defaults: bar 45, plates [45,35,25,10,5,2.5], step 5. kg defaults: bar 20, collars 0 in a gym (2.5 kg each in IPF competition), plates [25,20,15,10,5,2.5,1.25], step 2.5. Don't use heaviest-first for lb (60 per side: 45+10+5 vs 35+25). If the exact load is impossible, show the nearest loadable weights below and above.","appUse":"trainingMath.plates","showOn":[],"range":null,"sources":[{"c":"IPF Technical Rulebook, effective 1 March 2026, section 2.3 Bars and Discs (bar + collars 25 kg; collars 2.5 kg each; discs 1.25-25 kg; heavier discs innermost).","u":"https://www.powerlifting.sport/fileadmin/ipf/data/rules/technical-rules/english/2026_IPF_Technical_Rulebook__effective_01_March_2026__v3.pdf"}]},{"id":"formula-14","kind":"formula","grade":"C","claim":"Unit conversion: kg = lb x 0.45359237; lb = kg / 0.45359237 (exact by definition). Store the value in the unit it was entered in, together with the unit, and round only for display. 45 lb = 20.41 kg; 20 kg = 44.09 lb (different bars).","appUse":"trainingMath.convert","showOn":[],"range":null,"sources":[{"c":"NIST Handbook 44 (2026), Appendix B, p. B-12: 1 avoirdupois pound = 0.453 592 37 kilogram.","u":"https://www.nist.gov/system/files/documents/2025/12/30/appb-26-HB44-20251210.pdf"}]},{"id":"formula-15","kind":"formula","grade":"C","claim":"Fair PR detection, keyed by exerciseId with warm-ups excluded. Rep-max PR: a set beats the heaviest prior weight done for at least that many reps (valid at any rep count because it is observed). Estimated PR: only when reps to failure <= 10, effort is known, and the new e1RM beats the old one by at least 5 lb / 2.5 kg. Rep-max PRs rank above estimated ones. The 10-rep limit follows Reynolds 2006; the rest are app definitions.","appUse":"trainingMath.records","showOn":[],"range":null,"sources":[{"c":"Reynolds JM et al. J Strength Cond Res 2006;20(3):584-592 (no more than 10 reps in 1RM prediction).","u":"https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=TITLE:%22Prediction%20of%20one%20repetition%20maximum%20strength%20from%20multiple%20repetition%20maximum%20testing%20and%20anthropometry%22&resultType=core&format=json"}]}]};

const GRADE_ORDER = { A: 0, B: 1, C: 2 };
const isMyth = (c) => /^Myth check:\s*/.test(c.claim);
function claimsFor(ex) {
  if (!ex || ex.custom) return { own: [], cat: [], range: null };
  const own = [], cat = [];
  let range = null;
  for (const c of EV.kept) {
    for (const s of c.showOn) {
      if (own.some((x) => x.c === c)) break;
      if (s.exercise && (s.exercise === ex.name || (ex.aliases || []).includes(s.exercise))) own.push({ c, as: s.as });
      else if (s.category) {
        const [k, v] = s.category.split(":");
        if ((k === "equipment" && v === "band" && ex.eq === "Band") || (k === "muscle" && v === "core" && ex.area === "Core"))
          cat.push({ c, as: "category", group: v });
      }
    }
    if (c.range) {
      const names = [].concat(c.range.exercise);
      if (names.includes(ex.name) || (ex.aliases || []).some((n) => names.includes(n))) range = { ...c.range, c };
    }
  }
  const sort = (a, b) => GRADE_ORDER[a.c.grade] - GRADE_ORDER[b.c.grade] || (isMyth(b.c) ? 1 : 0) - (isMyth(a.c) ? 1 : 0);
  own.sort(sort); cat.sort(sort);
  return { own, cat, range };
}

  } else pick = a.exercises.findIndex((e) => open(e) >= 0);
  if (pick < 0) return "";
  const e = a.exercises[pick], si = open(e), s = e.sets[si], g = ghost(e, si), mode = modeOf(exOf(e.name));
  const val = (k) => (s[k] !== "" && s[k] !== null && s[k] !== undefined ? s[k] : g[k]);
  let v = "";
  if (mode === "cardio") v = val("min") ? `${val("min")} min` : "";
  else if (mode === "timed") v = val("sec") ? `${val("sec")} s` : "";
  else if (mode === "band") v = `${val("band") || "band?"} × ${val("r") || "?"}`;
  else if (mode === "weighted" || e.addWeight) v = `${val("w") || "?"} × ${val("r") || "?"}`;
  else v = val("r") ? `${val("r")} reps` : "";
  const lab = rowLabel(e, si);
  const setTxt = mode === "cardio" ? "" : lab === "W" ? " warm-up" : /^\d+$/.test(lab) ? ` set ${lab}` : lab === "D" ? " drop set" : " to-failure set";
  return `Next: ${e.name}${setTxt}${v ? ` · ${v}` : ""}`;
}

      <p class="h-sub">A helper muscle gets half a set. Band = a range of weekly sets from one pooled analysis of studies.</p>
      <div class="tkl" aria-hidden="true" style="margin-top:6px">${[4, 10, 18].map((t) => `<span style="left:${pct(t)}%">${t}</span>`).join("")}</div>
      ${list || `<div class="empty">No hard sets in this period.</div>`}
      ${moreBtn}
      <p class="hb-tiny" style="margin-top:8px">Tick marks at 4, 10 and 18 are bands from one pooled analysis (a preprint), shown for context, not a target.</p>
      ${unplaced ? `<p class="h-sub" style="margin-top:6px">Sets with no muscle detail: ${unplaced}</p>` : ""}

    </section>
    ${liftsPanel}
    ${bwPanel}
    <button class="h-btn quiet" data-a="history">${ic("history")}See all sessions</button>
  </div>`;
}

/* ===== HISTORY ===== */
function viewHistory() {
  const all = finished(S.person);
  const shown = all.slice(0, S.histShown);
  const recs = recordsIndex(S.person).byW;
  let out = "", month = "";
  for (const w of shown) {
    const m = `${["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][+w.date.slice(5, 7) - 1]} ${w.date.slice(0, 4)}`;
    if (m !== month) { if (month) out += `</section>`; out += `<section class="h-panel" style="padding-top:10px;padding-bottom:4px"><p class="h-eyebrow" style="margin-bottom:2px">${m}</p>`; month = m; }
    out += `<button class="lrow" data-a="session" data-id="${w.id}"><span class="name"><span class="truncate" style="display:block">${esc(w.name)}</span><span class="meta">${fmtDate(w.date)} · ${sessionSummary(w)}</span></span>${recs[w.id] ? `<span class="aux">${plural(recs[w.id].length, "record")}</span>` : ""}${ic("chevron-right", 14)}</button>`;
  }
  if (month) out += `</section>`;
  return `<div class="stack">${slimBar()}${backRow()}<h1 class="h-stat">History</h1><p class="h-sub" style="margin-top:-8px">${plural(all.length, "session")} · example data</p>${out}${all.length > S.histShown ? `<button class="h-btn quiet" data-a="hist-more">Show more</button>` : ""}</div>`;
}

            : `<div style="display:flex;align-items:center;gap:6px"><span class="numin" style="flex:1"><input class="num" inputmode="numeric" aria-label="Lowest reps" value="${esc(x.lo || "")}" data-b="rb-f" data-i="${i}" data-f="lo"></span><span class="h-sub">to</span><span class="numin" style="flex:1"><input class="num" inputmode="numeric" aria-label="Highest reps" value="${esc(x.hi || "")}" data-b="rb-f" data-i="${i}" data-f="hi"></span></div>`}
