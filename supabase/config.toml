# Supabase CLI config — the parts that MUST NOT live only in the dashboard.
#
# Several edge functions are deliberately PUBLIC (verify_jwt = false). They are not
# unguarded: each one checks its own shared secret and fails CLOSED if that secret
# is missing or wrong. They have to be public because their callers cannot present
# a Supabase JWT:
#
#   announce-update  called by the GitHub Pages deploy workflow with plain curl
#   plaid-webhook    called by Plaid's servers
#   cron-notify      called by pg_cron via net.http_post
#   cron-reminders   called by pg_cron via net.http_post
#   muse-read        called by an assistant's cloud VM, which has no session
#   muse-write       called by the same VM, through a separate door
#
# Of the first four, cron-reminders compares its token in constant time, through the
# same one-line helper both doors use (_shared/muse/safeEqual.ts). announce-update,
# plaid-webhook and cron-notify still compare with `!==`, which returns as soon as two
# characters differ — pre-existing, small over a network, and worth one line each the
# next time one of those files is opened.
#
# The first four take their secret from the query string. The two Muse doors take a
# per-person secret from a header instead, because a secret in a URL ends up in
# logs — and because the secret is WHO is calling, not just a doorbell: it decides
# which person is asking and which person every row is stamped with.
#
# The two doors are the most important callers to keep OUT of the JWT path: neither
# may ever be given a Supabase session, because 17 of the 18 tables let any
# signed-in account read and write every row. Each one's guard is its own
# per-person secret (MUSE_READ_GINO / MUSE_READ_XINYAN, MUSE_WRITE_GINO /
# MUSE_WRITE_XINYAN) compared in constant time, and each fails closed when the
# secret is missing, empty, or too short to be real. The read door has no write
# verb at all, and the write door has no delete verb and cannot move money.
# See docs/research/muse-bridge.
#
# Before this file existed those settings lived ONLY in the Supabase dashboard,
# which made them invisible to code review and — worse — resettable by any CLI
# deploy. A deploy that quietly flipped announce-update back to verify_jwt would
# break release notifications with a 401 that nothing in the app would surface.
#
# `notify` and `plaid` are intentionally absent: they are called from the app
# with a real user session, so they keep the default verify_jwt = true.
#
# See supabase/schema_v22_notify_triggers.sql for the invocation details.

project_id = "ganzefaciiyibselizqi"

[functions.announce-update]
verify_jwt = false

[functions.plaid-webhook]
verify_jwt = false

[functions.cron-notify]
verify_jwt = false

[functions.cron-reminders]
verify_jwt = false

[functions.muse-read]
verify_jwt = false

[functions.muse-write]
verify_jwt = false
